# default configuration - won't be overriden
# GEO Readiness - crawler access check
#
# Deployed to: digital-factory-data/karaf/etc/org.jahia.se.modules.georeadiness.cfg
# Edit it there at runtime. Changes apply immediately, no redeploy needed.
# The first line above stops Jahia overwriting your edits when the module is redeployed.

# Milliseconds to wait for each crawler fetch. Nine agents are tried, so the
# worst case is roughly nine times this value.
FETCH_TIMEOUT_MS=8000

# Maximum bytes read from a page. Enough for the head and the top of the body,
# which is all the initial-HTML checks need.
MAX_BODY_BYTES=1500000

# Per-user rate limit. Each check makes several outbound requests, so this
# protects the server and the audited site from one impatient editor.
RATE_MAX_CALLS=20
RATE_WINDOW_MS=600000

# Comma-separated list of agents to test, as name|user-agent pairs.
# Leave blank to use the built-in list, which is what you normally want.
CRAWLER_AGENTS=

# Optional. Force the public base URL when the site's server name is not
# resolvable from inside the container, for example http://localhost:8080
PUBLIC_BASE_URL=

# default configuration - won't be overridden
# GEO Readiness - crawler access check
#
# Deployed to: digital-factory-data/karaf/etc/org.jahia.se.modules.georeadiness.cfg
# Edit it there at runtime. Changes apply immediately, no redeploy needed.
# The first line above stops Jahia overwriting your edits when the module is redeployed.

# Milliseconds to wait for each crawler fetch. Sixteen agents are fetched three
# at a time, so the worst case is about six times this value.
FETCH_TIMEOUT_MS=8000

# Maximum bytes read from a page. Enough for the head and the top of the body,
# which is all the initial-HTML checks need.
MAX_BODY_BYTES=1500000

# Per-user rate limit. Each check makes several outbound requests, so this
# protects the server and the audited site from one impatient editor.
RATE_MAX_CALLS=20
RATE_WINDOW_MS=600000

# Comma-separated list of agents to test, as name|user-agent pairs.
# Leave blank to use the built-in list, which is what you normally want.
CRAWLER_AGENTS=

# Optional. Force the public base URL when the site's server name is not
# resolvable from inside the container, for example http://localhost:8080
PUBLIC_BASE_URL=

# ---- The written report (optional) ------------------------------------------
# When a provider, a model and a key are all set, the dashboard gains a
# "Report" tab: a model reads a digest of what this module measured and writes
# what it adds up to and what to do first. Nothing here is required; without
# these the tab does not appear and nothing leaves the server.
#
# What is sent to the provider: the site's measurements (scores, failing check
# ids, page paths and titles, sitemap/link/address/freshness counts, language
# coverage, schema coverage). Never page bodies, never the key.
#
# AI_PROVIDER: anthropic | openai | deepseek
AI_PROVIDER=
AI_MODEL=
AI_API_KEY=
# Output budget. A site-wide report is long; too low and the answer is cut.
AI_MAX_TOKENS=6000
# Optional. The provider's API base, for a proxy or a compatible gateway.
AI_BASE_URL=
# Optional. Site-specific instructions appended to the report prompt.
AI_PROMPT_APPENDIX=
# Report generations allowed per user per ten minutes. Each one is paid for.
AI_RATE_MAX_CALLS=5

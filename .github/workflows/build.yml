name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Build
        run: mvn -B clean install
      - uses: actions/upload-artifact@v4
        with:
          name: geo-readiness-bundle
          path: target/*.jar
          if-no-files-found: error

# This workflow is triggered every time a change is pushed to an open pull request.
# It is the gating CI for a Jahia module PR.
# Composite actions come from https://github.com/Jahia/jahia-modules-action, pinned by
# their major alias @v2 (a generated Git tag, re-pointed by every v2.x.y release).
name: On Code Change (PR)

permissions:
  contents: read
  packages: read

on:
  pull_request:
    types: [opened, reopened, synchronize]

# A read-only token. The repository default is write, which is what these jobs
# would inherit if this block were missing: every action in them, and every
# dependency of those actions, able to push to main. None of them needs it. The
# release pushes over SSH, Nexus and Dependency-Track are given their own
# credentials, and update-signature has nothing to commit for as long as this
# pom declares no signature element.
permissions:
  contents: read

# Each job below asks for a read-only token. The repository default is write,
# which is what they would inherit otherwise: every action in them, and every
# dependency of those actions, able to push to main. None of them needs it. The
# release pushes over SSH, Nexus and Dependency-Track are given their own
# credentials, and update-signature has nothing to commit for as long as this
# pom declares no signature element.
jobs:
  update-signature:
    permissions:
      contents: read
    name: Update module signature
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jahia/jahia-modules-action/update-signature@v2
        with:
          nexus_username: ${{ secrets.NEXUS_USERNAME }}
          nexus_password: ${{ secrets.NEXUS_PASSWORD }}

  static-analysis:
    permissions:
      contents: read
    name: Static Analysis (linting, vulns)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Jahia/jahia-modules-action/static-analysis@v2
        with:
          primary_release_branch: main
          auditci_level: critical
          # Neither package.json (root, tests/) declares a `lint` script, and the action
          # runs `yarn run lint` unconditionally when a package.json is present. Flip each
          # to false once that folder has one — see .github/MIGRATION-NOTES.md.
          skip_lint_modules: true
          skip_lint_tests: true
          # Test-tooling vulnerabilities do not ship to customers (this is the action default).
          skip_vulns_tests: true

  build:
    permissions:
      contents: read
    name: Build Module
    needs: update-signature
    runs-on: ubuntu-latest
    # Image with a warmed-up ~/.m2 so Maven does not download the world on every run.
    # https://github.com/Jahia/jahia-docker-mvn-cache
    container:
      image: ghcr.io/jahia/jahia-docker-mvn-cache:17-jdk-noble-mvn-loaded
      credentials:
        username: ${{ secrets.GH_PACKAGES_USERNAME }}
        password: ${{ secrets.GH_PACKAGES_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: jahia/jahia-modules-action/build@v2
        with:
          nexus_username: ${{ secrets.NEXUS_USERNAME }}
          nexus_password: ${{ secrets.NEXUS_PASSWORD }}
          mvn_settings_filepath: '.github/maven.settings.xml'

  sonar-analysis:
    permissions:
      contents: read
    name: Sonar Analysis
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jahia/jahia-modules-action/sonar-analysis@v2
        with:
          primary_release_branch: main
          github_pr_id: ${{ github.event.number }}
          sonar_url: ${{ secrets.SONAR_URL }}
          sonar_token: ${{ secrets.SONAR_TOKEN }}
          mvn_settings_filepath: '.github/maven.settings.xml'
          # The action defaults to Java 11; sonar-maven-plugin 5.x needs a Java 17 runtime.
          java_version: '17'

  # The tests/ Cypress suite, 127 assertions over the three servlets and the
  # jContent dashboard. It ran green against a real instance before this job was
  # added; until then nothing had ever executed it, and seven faults had
  # accumulated in the harness unnoticed.
  #
  # jahia_image is the one the sibling harnesses use. The tag `jahia/jahia-dev`
  # that tests/.env.example carried is not published and fails the pull.
  #
  # instance_type is deliberately left at the action's default, `self-hosted`.
  # Setting it to ubuntu-latest was tried and fails: the workflow runs
  # jahia-modules-action/helper, which reports the runner with
  # `ec2metadata --instance-id`, and that command does not exist on a
  # GitHub-hosted runner. The org has 21 self-hosted EC2 runners online carrying
  # the `self-hosted` label, so the default is both correct and available.
  # Reasoning from the ubuntu-latest that this repo's other jobs use does not
  # transfer - none of them goes through this reusable workflow.
  integration-tests:
    name: Integration Tests
    needs: build
    secrets: inherit
    uses: Jahia/jahia-modules-action/.github/workflows/reusable-integration-tests.yml@v2
    with:
      module_id: geo-readiness
      module_branch: ${{ github.ref }}
      jahia_image: ghcr.io/jahia/jahia-ee-dev:8-SNAPSHOT
      provisioning_manifest: provisioning-manifest-build.yml
      artifact_prefix: geo-readiness
      should_skip_testrail: true
      pagerduty_skip_notification: true

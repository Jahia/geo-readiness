# This workflow is triggered every time a change lands on the main branch.
# It rebuilds the module, pushes its SBOM to Dependency-Track and deploys the
# SNAPSHOT artifact to Nexus.
name: On merge to main

on:
  push:
    branches:
      - 'main'
    tags-ignore:
      - '**'

# A read-only token. The repository default is write, which is what these jobs
# would inherit if this block were missing: every action in them, and every
# dependency of those actions, able to push to main. None of them needs it. The
# release pushes over SSH, Nexus and Dependency-Track are given their own
# credentials, and update-signature has nothing to commit for as long as this
# pom declares no signature element.
permissions:
  contents: read

# Each job below asks for a read-only token. The repository default is write,
# which is what they would inherit otherwise: every action in them, and every
# dependency of those actions, able to push to main. None of them needs it. The
# release pushes over SSH, Nexus and Dependency-Track are given their own
# credentials, and update-signature has nothing to commit for as long as this
# pom declares no signature element.
jobs:
  update-signature:
    permissions:
      contents: read
    name: Update module signature
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jahia/jahia-modules-action/update-signature@v2
        with:
          nexus_username: ${{ secrets.NEXUS_USERNAME }}
          nexus_password: ${{ secrets.NEXUS_PASSWORD }}

  build:
    permissions:
      contents: read
    name: Build Module
    needs: update-signature
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/jahia/jahia-docker-mvn-cache:17-jdk-noble-mvn-loaded
      credentials:
        username: ${{ secrets.GH_PACKAGES_USERNAME }}
        password: ${{ secrets.GH_PACKAGES_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: jahia/jahia-modules-action/build@v2
        with:
          nexus_username: ${{ secrets.NEXUS_USERNAME }}
          nexus_password: ${{ secrets.NEXUS_PASSWORD }}
          mvn_settings_filepath: '.github/maven.settings.xml'

  sbom:
    permissions:
      contents: read
    name: SBOM processing
    needs: build
    runs-on: ubuntu-latest
    container:
      image: cyclonedx/cyclonedx-cli:0.24.2
    steps:
      - uses: jahia/jahia-modules-action/sbom-processing@v2
        with:
          dependencytrack_hostname: ${{ vars.DEPENDENCYTRACK_HOSTNAME }}
          dependencytrack_apikey: ${{ secrets.DEPENDENCYTRACK_APIKEY }}
          sbom_artifacts: 'build-artifacts'

  publish:
    permissions:
      contents: read
    name: Publish module
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/jahia/jahia-docker-mvn-cache:17-jdk-noble-mvn-loaded
      credentials:
        username: ${{ secrets.GH_PACKAGES_USERNAME }}
        password: ${{ secrets.GH_PACKAGES_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: jahia/jahia-modules-action/publish@v2
        with:
          nexus_username: ${{ secrets.NEXUS_USERNAME }}
          nexus_password: ${{ secrets.NEXUS_PASSWORD }}
          mvn_settings_filepath: '.github/maven.settings.xml'

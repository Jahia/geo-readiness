# PR lane: the module under test is built by the pipeline and deployed by the
# integration-tests action, so this manifest does NOT install it. What it does is
# make the instance able to resolve everything else the suite needs.
#
# geo-readiness declares:
#
#   Jahia-Depends: default,jcontent,robots,llms
#
# `default` and `jcontent` ship with the platform. `robots` and `llms` are
# community modules and do NOT, so they are installed here. Without them the
# module never resolves and every spec fails on a 404 from a servlet that was
# never mounted:
#
#   BundleException: Unable to resolve geo-readiness: missing requirement
#   com.jahia.modules.dependencies; (moduleIdentifier=robots)
#
# The suite's own requirement on top of that is a template set for createSite —
# override with CYPRESS_GEO_TEMPLATE_SET if the image already ships a different one.
#
# Applied by the CI action as ${MANIFEST}. By hand:
#   curl -s --fail -u root:<pwd> -X POST \
#        -H "Content-Type: application/yaml" \
#        --data-binary @tests/provisioning-manifest-build.yml \
#        http://localhost:8080/modules/api/provisioning

- addMavenRepository: 'https://store.jahia.com/nexus/content/repositories/jahia-public-app-store@id=JahiaStore'
- addMavenRepository: 'https://devtools.jahia.com/nexus/content/groups/public/@snapshots@noreleases@id=JahiaSnapshot'
- addMavenRepository: 'https://devtools.jahia.com/nexus/content/groups/public/@id=JahiaDevtools'

# UNRESOLVED — this entry does not currently work, and it is why 16 specs fail.
#
# createSite needs a template set. Without one it silently creates nothing:
# /sites holds only systemsite, and every endpoint then answers 403, because a
# site that is not there fails SiteScope.require with PathNotFoundException,
# which the servlets report as "cannot read node". The 403 is three steps
# removed from the cause, which is why this took a probe to find.
#
# Measured against ghcr.io/jahia/jahia-ee-dev:8-SNAPSHOT:
#
#   - 2.4.0 does not exist. The artifact is not in the app store at any version;
#     it is published to the devtools group, where the release is 4.0.0.
#   - 4.0.0 downloads, but will not resolve on this image:
#       BundleException: missing requirement com.jahia.services.content;
#       (nodetypes=bootstrap3mix:advancedPagination)
#     i.e. it wants the bootstrap3 template chain, which the image does not ship.
#   - the image ships no site template set of its own — the only candidate in
#     /modules is templates-system, which is the platform's base, not a set
#     createSite can build a site from.
#
# Someone who knows which template set this suite is meant to run against needs
# to decide: install the bootstrap3 chain alongside 4.0.0, pick a different set
# and point the suite at it with CYPRESS_GEO_TEMPLATE_SET, or use an image that
# ships one. Left here deliberately rather than silently dropped.
- installBundle: "mvn:org.jahia.modules/dx-base-demo-templates/4.0.0"
  autoStart: true
  ignoreIfPresent: true

# Module dependencies of geo-readiness.
#
# robots resolves from the devtools group above. llms is not published to any
# Maven repository reachable without credentials, so it is taken from its GitHub
# release; swap this for an mvn: coordinate once it is published.
- installBundle: "mvn:org.jahia.modules/robots/3.0.0"
  autoStart: true
  ignoreIfPresent: true

- installBundle: "https://github.com/Jahia/llms/releases/download/1_0_0/llms-1.0.0.jar"
  autoStart: true
  ignoreIfPresent: true
